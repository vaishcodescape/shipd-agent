[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipd-agent"
version = "0.1.0"
description = "Autonomous Shipd.ai Olympus/Mars review automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aditya Vaish" }]
keywords = ["shipd", "datacurve", "code-review", "automation", "playwright", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "playwright>=1.49.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "deepagents==0.7.34",
    "langgraph>=1.2,<2",
    "langchain>=1.4.9,<2",
    "langchain-anthropic>=1.7.10,<2",
    "langchain-openai>=1.7.0",
    "langchain-google-genai>=4.4.3,<5",
    "keyring>=25.0",
    "langchain-core>=1.7.6,<2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/vaishcodescape/shipd-agent"
Repository = "https://github.com/vaishcodescape/shipd-agent"
Issues = "https://github.com/vaishcodescape/shipd-agent/issues"
Changelog = "https://github.com/vaishcodescape/shipd-agent/releases"

[tool.setuptools]
package-dir = { "" = "shipd-agent" }
py-modules = [
    "orchestrator",
    "review_agent",
    "browser_session",
    "session_stats",
    "shipd_submit",
    "time_logs",
]

[tool.setuptools.packages.find]
where = ["shipd-agent"]
# Namespace discovery is on by default, so tests/ would ship as a top-level package.
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
review = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["shipd-agent/tests"]

[tool.ruff.lint]
# Pinned to the pre-0.17 defaults (pyflakes + syntax errors); newer ruff
# releases widen the default set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts put the package root on sys.path before importing siblings.
"shipd-agent/tests/debug_submit.py" = ["E402"]
"shipd-agent/workflow/submit_from_json.py" = ["E402"]
