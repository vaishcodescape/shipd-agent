name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Release runs this suite and only publishes when it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install linters
        run: python -m pip install ruff==0.17.0 shellcheck-py==0.11.0.1

      - name: Ruff
        run: ruff check --output-format=github .

      - name: ShellCheck
        run: shellcheck --severity=warning run.sh scripts/shipd.sh

      - name: CLI help smoke test
        run: ./run.sh --help

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The in-page form JS is Python-version independent, so one leg
          # installs Chromium and requires the browser regression tests to run.
          - os: ubuntu-latest
            python-version: "3.14"
            browser: true
          # The agent is run day-to-day on macOS.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium
        if: matrix.browser
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          SHIPD_REQUIRE_BROWSER: ${{ matrix.browser && '1' || '0' }}
        run: python -m pytest -ra

  package:
    name: Build & install wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Import every module from the installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-env"
          "${RUNNER_TEMP}/wheel-env/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata as md

          dist = md.distribution("shipd-agent")
          py_files = [str(f) for f in dist.files if str(f).endswith(".py")]
          assert not any(f.startswith("tests/") for f in py_files), "tests/ leaked into the wheel"
          modules = sorted(
              f[: -len(".py")].replace("/", ".").removesuffix(".__init__") for f in py_files
          )
          for name in modules:
              importlib.import_module(name)
          print(f"shipd-agent {dist.version}: imported {len(modules)} modules")
          PY
